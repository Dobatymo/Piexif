name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  format:
    name: Black (Python 3.6)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            python:3.6.15 \
            sh -c "python -m pip install --no-cache-dir pip==20.3.4 black==21.12b0 && python -m black --check --target-version py27 ."

  lint:
    name: Flake8 (${{ matrix.python-image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-image: ["python:2.7.18", "python:3.5.10"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report style violations
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            ${{ matrix.python-image }} \
            sh -c "python -m pip install --no-cache-dir pip==20.3.4 flake8==3.9.2 && python -m flake8 ."

  publish:
    name: Build and publish
    if: github.event_name == 'release'
    needs: [format, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
